# ============================================================
#  KARYA DESAIN GRAFIS  (bagian "Graphic design works")
# ------------------------------------------------------------
#  Setiap [[works]] = SATU KARTU. Kalau kartu diklik, muncul
#  pop-up berisi kumpulan gambar dari daftar "images".
#
#  Cara menambah gambar:
#   1. Simpan semua gambar di  static/images/design/
#      (mis. brand-01.jpg, brand-02.jpg, ...)
#   2. Isi daftar images, pisahkan dengan koma:
#        images = ["images/design/brand-01.jpg", "images/design/brand-02.jpg"]
#   3. (Opsional) image = sampul kartu. Kalau kosong, kartu tampil
#      abu-abu berikon, dan pop-up tetap menampilkan daftar images.
#
#  ratio : bentuk kartu. "4/5" (tegak), "1/1" (kotak), "16/10" (lebar)
#  icon  : ikon di kartu & pop-up (pen, layers, cube, grid)
#  Untuk karya/kartu baru: salin satu blok [[works]] di bawahnya.
# ============================================================

